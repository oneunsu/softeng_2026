<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>{% block head_title %}Board{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    {% include 'board/navbar.html' %}

    <div class="container my-4">
        <div class="row">
            <div class="col-lg-8" id="main-area">
                {% block main_area %}
                {% endblock %}
            </div>

            <div class="col-lg-4">
                <div class="card my-4" id="categories-card">
                    <h5 class="card-header">Categories</h5>
                    <div class="card-body">
                        <ul class="list-unstyled mb-0">
                            {% for category in categories %}
                                <li>
                                    <a href="#">{{ category.name }} ({{ category.post_set.count }})</a>
                                </li>
                            {% endfor %}
                            <li>
                                <a href="#">미분류 ({{ no_category_post_count }})</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    {% include 'board/footer.html' %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
